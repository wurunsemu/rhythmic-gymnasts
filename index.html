<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A3C5E;
  --primary:#1A3C5E;
  --red:#C8102E;
  --green:#22c55e;
  --yellow:#f59e0b;
  --danger:#ef4444;
  --bg:#f0f4f8;
  --card:#ffffff;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-size:16px;
  line-height:1.5;
}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ============================================================
   LOADING
   ============================================================ */
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   LOGIN
   ============================================================ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(135deg,var(--navy) 0%,#2a5a8e 100%)}
.login-card{background:var(--card);border-radius:20px;padding:40px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:1.4rem;color:var(--navy);font-weight:800;line-height:1.2}
.login-logo p{color:var(--muted);font-size:.85rem;margin-top:4px}
.login-stripe{width:48px;height:4px;background:var(--red);border-radius:2px;margin:12px auto 0}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;outline:none;transition:border-color .2s;background:#fafafa}
.form-group input:focus{border-color:var(--navy);background:#fff}
.btn-primary{width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{padding:8px 16px;background:transparent;color:var(--navy);border:1.5px solid var(--navy);border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-secondary:hover{background:var(--navy);color:#fff}
.btn-sm{padding:7px 14px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{opacity:.85}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{opacity:.85}
.login-err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:10px 14px;font-size:.85rem;margin-bottom:14px;display:none}
.login-err.show{display:block}
.lang-switch-login{text-align:center;margin-top:20px}
.lang-btn{background:transparent;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.8);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;margin:0 4px;transition:all .2s}
.lang-btn.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.8);color:#fff}

/* ============================================================
   HEADER
   ============================================================ */
.header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-brand{font-weight:800;font-size:1rem;line-height:1.1;flex:1}
.header-brand small{font-weight:400;font-size:.75rem;opacity:.75;display:block}
.header-actions{display:flex;align-items:center;gap:8px}
.lang-toggle{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600}
.lang-toggle:hover{background:rgba(255,255,255,.2)}
.logout-btn{background:rgba(200,16,46,.25);border:1px solid rgba(200,16,46,.5);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600}
.logout-btn:hover{background:var(--red)}

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
.main{flex:1;padding:16px;max-width:960px;margin:0 auto;width:100%}
.main-wide{flex:1;padding:16px;width:100%}

/* ============================================================
   CARDS
   ============================================================ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:1.1rem}

/* ============================================================
   TABS
   ============================================================ */
.tab-bar{display:flex;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.tab-btn{flex:1;padding:12px 8px;border:none;background:transparent;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy);background:rgba(26,60,94,.04)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ============================================================
   FORMS
   ============================================================ */
.form-row{margin-bottom:18px}
.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.form-sublabel{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.form-select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;background:#fafafa;outline:none;cursor:pointer}
.form-select:focus{border-color:var(--navy)}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;background:#fafafa;outline:none}
.form-input:focus{border-color:var(--navy);background:#fff}
.form-textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;background:#fafafa;outline:none;resize:vertical;min-height:80px}
.form-textarea:focus{border-color:var(--navy);background:#fff}

/* Slider */
.slider-wrap{margin-bottom:14px}
.slider-label{font-size:.9rem;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.slider-label span{color:var(--navy);font-size:1rem;font-weight:800}
.slider-desc{font-size:.75rem;color:var(--muted);margin-bottom:6px;min-height:18px}
input[type=range]{width:100%;accent-color:var(--navy);cursor:pointer;height:6px}
.slider-ticks{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted);margin-top:2px;padding:0 2px}

/* Borg selector */
.borg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.borg-btn{padding:10px 4px;border:2px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;text-align:center;transition:all .15s}
.borg-btn .borg-num{font-size:1.1rem;font-weight:800;color:var(--navy)}
.borg-btn .borg-desc{font-size:.6rem;color:var(--muted);line-height:1.1;margin-top:2px}
.borg-btn.selected{border-color:var(--navy);background:var(--navy)}
.borg-btn.selected .borg-num,.borg-btn.selected .borg-desc{color:#fff}

/* ============================================================
   TRAFFIC LIGHT
   ============================================================ */
.tl-table{width:100%;border-collapse:collapse;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tl-table th{background:var(--navy);color:#fff;padding:12px 14px;font-size:.8rem;font-weight:600;text-align:left}
.tl-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
.tl-table tr:last-child td{border-bottom:none}
.tl-table tr:nth-child(even) td{background:#f8fafc}
.tl-dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}
.tl-dot.green{background:var(--green)}
.tl-dot.yellow{background:var(--yellow)}
.tl-dot.red{background:var(--danger)}
.tl-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:700}
.tl-badge.green{background:#dcfce7;color:#15803d}
.tl-badge.yellow{background:#fef9c3;color:#a16207}
.tl-badge.red{background:#fee2e2;color:#b91c1c}

/* ============================================================
   STATUS OVERVIEW CARD
   ============================================================ */
.status-overview{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.status-box{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.status-box .label{font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.status-box .value{font-size:1.6rem;font-weight:800;color:var(--navy)}
.status-box .sub{font-size:.75rem;color:var(--muted);margin-top:2px}

/* ============================================================
   ALERT
   ============================================================ */
.alert{border-radius:10px;padding:12px 16px;font-size:.85rem;margin-bottom:14px}
.alert-info{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
.alert-warn{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}
.alert-err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.alert-ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}

/* ============================================================
   RESEARCHER DASHBOARD
   ============================================================ */
.dashboard-tabs{display:flex;gap:4px;background:var(--navy);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto}
.dtab-btn{padding:9px 18px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.65);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.dtab-btn.active{background:rgba(255,255,255,.2);color:#fff}
.dtab-btn:hover:not(.active){background:rgba(255,255,255,.1);color:#fff}

/* Charts */
.chart-wrap{position:relative;height:220px;margin-top:12px}

/* Table wrapper for overflow */
.table-scroll{overflow-x:auto}

/* Athlete detail rows */
.athlete-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.athlete-row:hover{background:#f8fafc;border-radius:8px;padding-left:8px}
.athlete-num{width:36px;height:36px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0}
.athlete-info{flex:1}
.athlete-info .name{font-weight:700;font-size:.9rem}
.athlete-info .role-tag{font-size:.72rem;color:var(--muted)}

/* ============================================================
   EXPORT BUTTON
   ============================================================ */
.export-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:12px;transition:opacity .2s}
.export-btn:hover{opacity:.85}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:2.5rem;margin-bottom:8px}
.empty p{font-size:.85rem}

/* ============================================================
   HRV METRICS TABLE
   ============================================================ */
.hrv-metrics-table{margin-top:14px;margin-bottom:14px}
.hrv-metric-group{margin-bottom:12px}
.hrv-metric-group-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #e2e8f0}
.hrv-metric-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid #f0f4f8;font-size:.85rem}
.hrv-metric-row:last-child{border-bottom:none}
.hrv-metric-name{color:#374151;font-weight:500}
.hrv-metric-val{font-weight:700;color:var(--navy);font-size:.9rem}
.hrv-unit{font-size:.72rem;color:var(--muted);margin-left:3px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:600px){
  .main,.main-wide{padding:12px}
  .status-overview{grid-template-columns:repeat(2,1fr)}
  .tl-table th,.tl-table td{padding:9px 10px;font-size:.78rem}
  .dashboard-tabs{flex-wrap:nowrap}
}
@media(min-width:768px){
  .main{padding:24px}
  .borg-grid{grid-template-columns:repeat(5,1fr)}
}

/* ============================================================
   MISC
   ============================================================ */
.section-heading{font-size:1.1rem;font-weight:800;color:var(--navy);margin-bottom:14px}
.muted{color:var(--muted);font-size:.8rem}
.mb8{margin-bottom:8px}
.mb16{margin-bottom:16px}
.flex-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.success-banner{background:var(--green);color:#fff;border-radius:10px;padding:14px 16px;text-align:center;font-weight:700;margin-bottom:16px;display:none}
.success-banner.show{display:block}
.today-badge{display:inline-block;background:#e0f2fe;color:#0369a1;border-radius:6px;padding:3px 8px;font-size:.72rem;font-weight:700;margin-left:8px}
.already-done{background:#dcfce7;border:1px solid #bbf7d0;border-radius:10px;padding:14px 16px;color:#15803d;font-size:.85rem;text-align:center;font-weight:600;margin-bottom:14px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* ============================================================
   QUESTIONNAIRE STYLES
   ============================================================ */
.quest-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.quest-list{display:flex;flex-direction:column;gap:10px}
.quest-item-btn{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;cursor:pointer;text-decoration:none;color:inherit}
.quest-item-btn.done{background:#dcfce7;border-color:#bbf7d0}
.quest-item-name{font-weight:700;font-size:.9rem;color:var(--navy)}
.quest-badge{font-size:.75rem;padding:3px 8px;border-radius:6px;font-weight:700}
.quest-badge.open{background:#dbeafe;color:#1d4ed8}
.quest-badge.done{background:#dcfce7;color:#15803d}
.likert-wrap{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.likert-item{background:#f8fafc;border-radius:10px;padding:14px}
.likert-q{font-size:.88rem;color:#334155;margin-bottom:10px;line-height:1.5}
.likert-item-num{font-weight:700;color:var(--navy);margin-right:4px}
.likert-opts{display:flex;gap:6px;flex-wrap:wrap}
.likert-opt{flex:1;min-width:36px;padding:8px 4px;border:2px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:.78rem;text-align:center;transition:all .15s;color:#475569;font-weight:600}
.likert-opt.selected{border-color:var(--primary);background:var(--primary);color:#fff}
.likert-opt:hover:not(.selected){border-color:var(--primary);background:#e0eaf5}
.quest-progress{height:6px;background:#e2e8f0;border-radius:3px;margin-bottom:16px;overflow:hidden}
.quest-progress-bar{height:100%;background:var(--primary);border-radius:3px;transition:width .3s}
.quest-page-info{font-size:.8rem;color:var(--muted);margin-bottom:8px;text-align:center}
.quest-nav{display:flex;gap:10px;margin-top:16px}
.quest-nav button{flex:1}
.quest-manage-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.quest-manage-name{font-weight:700;font-size:.88rem;color:var(--navy)}
.quest-manage-desc{font-size:.75rem;color:var(--muted);margin-top:2px}
.toggle-btn{padding:7px 14px;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.toggle-btn.active{background:var(--red);color:#fff}
.toggle-btn.inactive{background:#e2e8f0;color:#475569}
.set-pass-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.set-pass-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:32px 24px;width:100%;max-width:360px}
.forgot-link{display:block;text-align:center;margin-top:12px;color:var(--primary);font-size:.82rem;text-decoration:none}
.forgot-link:hover{text-decoration:underline}
</style>
</head>

/* ============================================================
   HRV CALCULATION UTILITIES
   ============================================================ */
/**
 * Parse RR intervals from raw file text.
 * Supports:
 *   - Plain text: one number per line (ms integers or s decimals)
 *   - CSV with header: column named rr, ibi, r-r, rr_ms, rr interval, etc.
 * Auto-detects ms vs seconds (val > 2.5 → ms; 0.3–2.0 → multiply by 1000).
 */
function parseRRIntervals(text) {
  const lines = text.trim().split(/\r?\n/);
  if (!lines.length) return [];

  // Try CSV with header row
  const headerLine = lines[0].toLowerCase();
  const separatorMatch = headerLine.match(/[,;\t]/);
  if (separatorMatch) {
    const sep = separatorMatch[0];
    const cols = headerLine.split(sep).map(c => c.trim().replace(/^"|"$/g,''));
    const rrIdx = cols.findIndex(c => /^(rr|ibi|r-r|rr_ms|rr interval|r_r)/.test(c));
    if (rrIdx >= 0) {
      const vals = [];
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(sep);
        if (!parts[rrIdx]) continue;
        const raw = parseFloat(parts[rrIdx].trim().replace(/^"|"$/g,'').replace(',','.'));
        if (isNaN(raw) || raw <= 0) continue;
        const ms = raw > 2.5 ? raw : raw * 1000;
        if (ms >= 250 && ms <= 2500) vals.push(ms);
      }
      if (vals.length > 10) return vals;
      // Fall through if we got almost nothing (maybe wrong column)
    }
  }

  // Plain text: one number per line (also handles CSV-without-header first column)
  const vals = [];
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('/') || trimmed.startsWith(';')) continue;
    // Take first token on the line
    const tok = trimmed.split(/[,;\t\s]+/)[0].replace(',','.');
    const raw = parseFloat(tok);
    if (isNaN(raw) || raw <= 0) continue;
    const ms = raw > 2.5 ? raw : raw * 1000;
    if (ms >= 250 && ms <= 2500) vals.push(ms);
  }
  return vals;
}

/* ============================================================
   COMPREHENSIVE HRV ANALYSIS
   ============================================================ */

/** Cooley-Tukey in-place radix-2 FFT (re[] and im[] must be length 2^n) */
function fft(re, im) {
  const n = re.length;
  // Bit-reversal permutation
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wRe = Math.cos(ang), wIm = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curRe = 1, curIm = 0;
      for (let j = 0; j < len / 2; j++) {
        const uRe = re[i+j], uIm = im[i+j];
        const vRe = re[i+j+len/2]*curRe - im[i+j+len/2]*curIm;
        const vIm = re[i+j+len/2]*curIm + im[i+j+len/2]*curRe;
        re[i+j] = uRe+vRe; im[i+j] = uIm+vIm;
        re[i+j+len/2] = uRe-vRe; im[i+j+len/2] = uIm-vIm;
        const tmp = curRe*wRe - curIm*wIm;
        curIm = curRe*wIm + curIm*wRe;
        curRe = tmp;
      }
    }
  }
}

/**
 * Frequency-domain HRV: resample to 4 Hz grid, FFT, integrate power bands.
 * Returns { tp, lf, hf, lfHf, lfNorm, hfNorm } or null if too few intervals.
 */
function computeFrequencyDomain(rrMs) {
  if (rrMs.length < 150) return null; // need ~2.5 min

  const fs = 4; // 4 Hz resample
  // Build cumulative time axis (seconds)
  const times = [0];
  for (let i = 1; i < rrMs.length; i++) times.push(times[i-1] + rrMs[i-1]/1000);
  const duration = times[times.length-1];
  const nSamples = Math.floor(duration * fs);
  if (nSamples < 64) return null;

  // Linear interpolation to uniform grid
  const signal = new Array(nSamples);
  let k = 0;
  for (let i = 0; i < nSamples; i++) {
    const t = i / fs;
    while (k < times.length - 2 && times[k+1] < t) k++;
    const alpha = times[k+1] > times[k] ? (t - times[k]) / (times[k+1] - times[k]) : 0;
    signal[i] = rrMs[k] + alpha * (rrMs[Math.min(k+1, rrMs.length-1)] - rrMs[k]);
  }

  // Zero-pad to next power of 2
  let N = 1; while (N < nSamples) N <<= 1;
  const re = new Array(N).fill(0), im = new Array(N).fill(0);
  // Detrend (subtract mean) and copy
  const mean = signal.reduce((s,v)=>s+v,0)/signal.length;
  for (let i = 0; i < nSamples; i++) re[i] = signal[i] - mean;

  fft(re, im);

  // Power spectral density: |X[k]|² / (N * fs)
  const freqRes = fs / N;
  let tp = 0, lf = 0, hf = 0;
  for (let k2 = 1; k2 < N/2; k2++) {
    const freq = k2 * freqRes;
    const power = (re[k2]*re[k2] + im[k2]*im[k2]) / (N * fs);
    if (freq >= 0.0033 && freq < 0.4) tp += power * freqRes;
    if (freq >= 0.04  && freq < 0.15) lf += power * freqRes;
    if (freq >= 0.15  && freq < 0.4)  hf += power * freqRes;
  }

  const lfHf   = hf > 0 ? lf / hf : null;
  const lfNorm = (lf + hf) > 0 ? (lf / (lf + hf)) * 100 : null;
  const hfNorm = (lf + hf) > 0 ? (hf / (lf + hf)) * 100 : null;

  return {
    tp:     Math.round(tp),
    lf:     Math.round(lf),
    hf:     Math.round(hf),
    lfHf:   lfHf   !== null ? Math.round(lfHf * 100) / 100 : null,
    lfNorm: lfNorm !== null ? Math.round(lfNorm * 10) / 10  : null,
    hfNorm: hfNorm !== null ? Math.round(hfNorm * 10) / 10  : null,
  };
}

/**
 * Sample Entropy (SampEn) — m=2, r=0.2*SDNN, max 300 points for performance.
 */
function computeSampEn(rr, m, r, maxN) {
  const data = rr.length > maxN ? rr.slice(0, maxN) : rr;
  const n = data.length;
  let A = 0, B = 0;
  for (let i = 0; i < n - m; i++) {
    for (let j = i + 1; j < n - m; j++) {
      let matchB = true, matchA = true;
      for (let k = 0; k < m; k++) { if (Math.abs(data[i+k] - data[j+k]) > r) { matchB = false; break; } }
      if (matchB) {
        B++;
        if (Math.abs(data[i+m] - data[j+m]) > r) matchA = false;
        if (matchA) A++;
      }
    }
  }
  if (B === 0) return null;
  return Math.round(-Math.log(A / B) * 1000) / 1000;
}

/**
 * Full HRV analysis. Returns all time-domain, frequency-domain, and nonlinear metrics.
 */
function computeFullHRV(rrMs) {
  if (!rrMs || rrMs.length < 2) return null;
  const n = rrMs.length;
  const totalMs = rrMs.reduce((s, v) => s + v, 0);
  const meanRR = totalMs / n;
  const meanHR = Math.round(60000 / meanRR);

  // SDNN
  const variance = rrMs.reduce((s, v) => s + (v - meanRR) ** 2, 0) / (n - 1);
  const sdnn = Math.sqrt(variance);

  // RMSSD, NN50, pNN50
  let sqDiffSum = 0, nn50 = 0;
  for (let i = 1; i < n; i++) {
    const d = rrMs[i] - rrMs[i-1];
    sqDiffSum += d * d;
    if (Math.abs(d) > 50) nn50++;
  }
  const rmssd = Math.sqrt(sqDiffSum / (n - 1));
  const pnn50 = Math.round((nn50 / (n - 1)) * 1000) / 10;

  // TiNN — triangular interpolation of RR histogram
  const binW = 7.8125; // 1000/128 ms
  const bins = {};
  for (const rr of rrMs) {
    const b = Math.round(rr / binW);
    bins[b] = (bins[b] || 0) + 1;
  }
  const peak = Object.entries(bins).sort((a,b)=>b[1]-a[1])[0];
  const peakBin = parseInt(peak[0]);
  // Find leftmost N and rightmost M that bound a triangle containing the peak
  const minBin = Math.min(...Object.keys(bins).map(Number));
  const maxBin = Math.max(...Object.keys(bins).map(Number));
  const tiNN = Math.round((maxBin - minBin) * binW);

  // Poincaré — SD1, SD2
  const sd1 = Math.round((rmssd / Math.sqrt(2)) * 10) / 10;
  const sd2 = Math.round(Math.sqrt(2 * sdnn * sdnn - 0.5 * rmssd * rmssd) * 10) / 10;
  const sd2sd1 = sd1 > 0 ? Math.round((sd2 / sd1) * 100) / 100 : null;

  // SampEn
  const sampen = computeSampEn(rrMs, 2, 0.2 * sdnn, 300);

  // Frequency domain (may be null if too few intervals)
  const freq = computeFrequencyDomain(rrMs);

  return {
    meanRR:    Math.round(meanRR),
    meanHR,
    sdnn:      Math.round(sdnn * 10) / 10,
    rmssd:     Math.round(rmssd * 10) / 10,
    nn50,
    pnn50,
    tiNN,
    sd1,
    sd2,
    sd2sd1,
    sampen,
    tp:        freq ? freq.tp     : null,
    lf:        freq ? freq.lf     : null,
    hf:        freq ? freq.hf     : null,
    lfHf:      freq ? freq.lfHf   : null,
    lfNorm:    freq ? freq.lfNorm : null,
    hfNorm:    freq ? freq.hfNorm : null,
    count: n,
    durationSec: Math.round(totalMs / 1000),
  };
}

function formatDate(d) {

  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(state.lang === 'tr' ? 'tr-TR' : 'en-GB', {day:'2-digit',month:'short',year:'numeric'});
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function dlCSV(filename, rows, headers) {
  const csv = [headers.join(','), ...rows.map(r => headers.map(h => JSON.stringify(r[h] ?? '')).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function showSuccess(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ============================================================
   TRAFFIC LIGHT LOGIC
   ============================================================ */
function acwrStatus(rpeRows) {
  // rpeRows sorted ascending by date, each with session_load
  if (rpeRows.length < 7) return null;
  const now = new Date();
  const msPerDay = 86400000;
  const acute = rpeRows.filter(r => {
    const d = new Date(r.session_date);
    return (now - d) / msPerDay <= 7;
  }).reduce((s, r) => s + (r.session_load || 0), 0);

  const chronic28 = rpeRows.filter(r => {
    const d = new Date(r.session_date);
    return (now - d) / msPerDay <= 28;
  }).reduce((s, r) => s + (r.session_load || 0), 0) / 4;

  if (chronic28 === 0) return null;
  const acwr = acute / chronic28;
  if (acwr >= 0.8 && acwr <= 1.3) return 'green';
  if (acwr >= 0.6 && acwr <= 1.5) return 'yellow';
  return 'red';
}

function hrvStatus(hrvRows) {
  if (hrvRows.length < 3) return null;
  const sorted = [...hrvRows].sort((a,b) => a.reading_date > b.reading_date ? 1 : -1);
  const recent = sorted.slice(-7);
  const baseline = recent.slice(0,-1).reduce((s,r) => s + r.rmssd, 0) / (recent.length - 1);
  const latest = recent[recent.length - 1].rmssd;
  const diff = (baseline - latest) / baseline;
  if (diff < 0.1) return 'green';
  if (diff < 0.2) return 'yellow';
  return 'red';
}

function hooperStatus(total) {
  if (total == null) return null;
  if (total <= 16) return 'green';
  if (total <= 22) return 'yellow';
  return 'red';
}

function overallStatus(a, b, c) {
  const vals = [a,b,c].filter(x => x !== null);
  if (vals.length === 0) return null;
  if (vals.includes('red')) return 'red';
  if (vals.includes('yellow')) return 'yellow';
  return 'green';
}

function tlBadge(status) {
  if (!status) return '<span class="muted">—</span>';
  const labels = {green: t('green'), yellow: t('yellow'), red: t('red')};
  return `<span class="tl-badge ${status}">${labels[status]}</span>`;
}

      <button class="btn-primary" id="rr-save-btn" onclick="saveRRResult()">${t('hrv_save_result')}</button>
    </div>
  </div>`;

  if (!rows.length) return `
  <div class="card"><div class="empty"><div class="icon">💓</div><p>${t('no_data')}</p></div></div>
  ${uploadCard}`;

  const baseline = rows.length >= 2 ? (rows.slice(-7).reduce((s,r)=>s+r.rmssd,0)/Math.min(rows.length,7)).toFixed(1) : null;
  const latest = rows[rows.length-1];
  return `<div class="card">
    <div class="card-title"><span class="icon">💓</span>${t('hrv_title')}</div>
    <p class="muted mb16">${t('hrv_sub')}</p>
    <div class="status-overview" style="grid-template-columns:repeat(2,1fr);margin-bottom:12px">
      <div class="status-box"><div class="label">${t('rmssd')}</div><div class="value">${latest.rmssd}</div><div class="sub">${formatDate(latest.reading_date)}</div></div>
      <div class="status-box"><div class="label">${t('baseline')}</div><div class="value">${baseline || '—'}</div><div class="sub">ms</div></div>
    </div>
    <div class="chart-wrap"><canvas id="hrv-chart-sporcu"></canvas></div>
  </div>
  ${uploadCard}`;
}

async function renderArastirmaci() {
  // Show the shell immediately so tab buttons are visible/clickable right away
  renderResearchShell();
  const preload = document.getElementById('research-content');
  if (preload) preload.innerHTML = `<div class="loading" style="min-height:200px"><div class="spinner"></div></div>`;
  // Load athletes data with timeout, then render the initial tab
  state.athletes = await getAllAthletes();

function renderResearchShell() {
  const tabs = ['overview','athletes_tab','data_entry','export'];
  document.getElementById('app').innerHTML = `
  ${renderHeader(t('arastirmaci'))}
  <div class="main-wide" style="padding:12px 16px">
    <div class="dashboard-tabs">
      ${tabs.map(tab => `<button class="dtab-btn ${state.researchTab === tab ? 'active' : ''}" onclick="switchResearchTab('${tab}')">${t(tab)}</button>`).join('')}
    </div>
    <div id="research-content"></div>
  </div>`;
}

async function switchResearchTab(tab) {
  state.researchTab = tab;
  // Update tab buttons
  document.querySelectorAll('.dtab-btn').forEach(b => b.classList.remove('active'));
  const btn = [...document.querySelectorAll('.dtab-btn')].find(b => b.textContent.trim() === t(tab));
  if (btn) btn.classList.add('active');

  const content = document.getElementById('research-content');
  if (!content) return;
  content.innerHTML = `<div class="loading" style="min-height:200px"><div class="spinner"></div></div>`;

  try {
    if (tab === 'overview') await renderOverviewTab(content);
    else if (tab === 'athletes_tab') await renderAthletesTab(content);
    else if (tab === 'data_entry') await renderDataEntryTab(content);
    else if (tab === 'export') renderExportTab(content);
  } catch(err) {
    console.error('[switchResearchTab] tab error:', tab, err);
    content.innerHTML = `<div class="card"><div class="alert alert-err" style="margin:0">
      <strong>⚠ Sekme yüklenemedi / Tab failed to load</strong><br>
      <code style="font-size:.8rem">${err && err.message ? err.message : String(err)}</code>
    </div></div>`;
  }
}

async function showAthleteDetail(aid) {
  const a = state.athletes.find(x => x.id === aid);
  if (!a) return;
  const panel = document.getElementById('athlete-detail-panel');
  if (!panel) return;
  panel.innerHTML = `<div class="card"><div class="loading" style="min-height:120px"><div class="spinner"></div></div></div>`;

  const [hrv, hoop, rpe, questHist] = await Promise.all([
    getHRVHistory(a.id, 60), getHooperHistory(a.id, 30), getRPEHistory(a.id, 28),
    getAthleteQuestHistory(a.id)
  ]);

  // Group questionnaire history by type
  const questByType = {};
  questHist.forEach(r => {
    if (!questByType[r.questionnaire_type]) questByType[r.questionnaire_type] = [];
    questByType[r.questionnaire_type].push(r);
  });

  // Build questionnaire results table (latest per type + count)
  const questTableRows = Object.entries(questByType).map(([qtype, entries]) => {
    const def = QUESTIONNAIRES[qtype];
    const name = def ? (state.lang === 'tr' ? def.name_tr : def.name_en) : qtype;
    const latest = entries[entries.length - 1];
    return `<tr>
      <td><strong>${name}</strong></td>
      <td>${entries.length}</td>
      <td>${latest.response_date}</td>
      <td><strong>${latest.score ?? '—'}</strong></td>
    </tr>`;
  }).join('');

  // Build quest chart data (all responses, sorted by date)
  const questChartSection = Object.entries(questByType).map(([qtype, entries]) => {
    const def = QUESTIONNAIRES[qtype];
    const name = def ? (state.lang === 'tr' ? def.name_tr : def.name_en) : qtype;
    const cid = `chart-quest-${a.id}-${qtype}`;
    return `
      <div class="section-heading" style="font-size:.8rem;margin-top:12px">${name} — ${state.lang==='tr'?'Toplam Puan':'Total Score'}</div>
      <div class="chart-wrap" style="height:140px"><canvas id="${cid}"></canvas></div>`;
  }).join('');

  panel.innerHTML = `
  <div class="card">
    <div class="card-title"><span class="icon">👤</span>${a.name} ${a.surname} ${a.jersey_number ? `#${a.jersey_number}` : ''}</div>

    <div class="section-heading" style="font-size:.85rem;margin-top:4px">HRV — RMSSD (ms)</div>
    <div class="chart-wrap"><canvas id="chart-hrv-${a.id}"></canvas></div>

    <div class="section-heading" style="font-size:.85rem;margin-top:16px">Hooper Index</div>
    <div class="chart-wrap"><canvas id="chart-hoop-${a.id}"></canvas></div>

    <div class="section-heading" style="font-size:.85rem;margin-top:16px">${state.lang === 'tr' ? 'Antrenman Yükü (RPE × Süre)' : 'Session Load (RPE × Duration)'}</div>
    <div class="chart-wrap"><canvas id="chart-rpe-${a.id}"></canvas></div>

    <div class="card-title" style="margin-top:20px"><span class="icon">📋</span>${t('quest_results')}</div>
    ${questHist.length === 0
      ? `<p class="muted" style="text-align:center;padding:12px">${t('quest_no_data')}</p>`
      : `<div class="table-scroll"><table class="tl-table">
          <thead><tr>
            <th>${state.lang==='tr'?'Anket':'Questionnaire'}</th>
            <th>${state.lang==='tr'?'Yanıt Sayısı':'Responses'}</th>
            <th>${state.lang==='tr'?'Son Tarih':'Last Date'}</th>
            <th>${state.lang==='tr'?'Son Puan':'Last Score'}</th>
          </tr></thead>
          <tbody>${questTableRows}</tbody>
        </table></div>
        ${questChartSection}`
    }
  </div>`;

  // Draw charts
  setTimeout(() => {
    drawLineChart(`chart-hrv-${a.id}`, hrv.map(r=>r.reading_date), hrv.map(r=>r.rmssd), 'RMSSD', 'rgba(26,60,94,1)', 'rgba(26,60,94,0.1)');
    drawLineChart(`chart-hoop-${a.id}`, hoop.map(r=>r.entry_date), hoop.map(r=>r.total_score), 'Hooper', 'rgba(200,16,46,1)', 'rgba(200,16,46,0.1)', 4, 28);
    drawBarChart(`chart-rpe-${a.id}`, rpe.map(r=>r.session_date), rpe.map(r=>r.session_load), state.lang === 'tr' ? 'Yük' : 'Load');
    // Quest charts
    Object.entries(questByType).forEach(([qtype, entries]) => {
      const cid = `chart-quest-${a.id}-${qtype}`;
      drawLineChart(cid, entries.map(r=>r.response_date), entries.map(r=>r.score), qtype, 'rgba(22,163,74,1)', 'rgba(22,163,74,0.1)');
    });
  }, 100);
}

function chartDefaults() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {legend:{display:false}, tooltip:{mode:'index',intersect:false}},
    scales: {
      x: {grid:{color:'rgba(0,0,0,0.04)'}, ticks:{font:{size:10}, maxTicksLimit:8}},
      y: {grid:{color:'rgba(0,0,0,0.04)'}, ticks:{font:{size:10}}}
    }
  };
}
function drawLineChart(id, labels, data, label, color, fill, yMin, yMax) {
  const el = document.getElementById(id);
  if (!el) return;
  const existing = Chart.getChart(el);
  if (existing) existing.destroy();
  const opts = chartDefaults();
  if (yMin !== undefined) opts.scales.y.min = yMin;
  if (yMax !== undefined) opts.scales.y.max = yMax;
  new Chart(el, {
    type:'line',
    data:{labels, datasets:[{label, data, borderColor:color, backgroundColor:fill, fill:true, tension:0.3, pointRadius:3}]},
    options:opts
  });
}
function drawBarChart(id, labels, data, label) {
  const el = document.getElementById(id);
  if (!el) return;
  const existing = Chart.getChart(el);
  if (existing) existing.destroy();
  new Chart(el, {
    type:'bar',
    data:{labels, datasets:[{label, data, backgroundColor:'rgba(26,60,94,0.65)', borderRadius:4}]},
    options:chartDefaults()
  });
}

async function loadQuestTab() {
  const inner = document.getElementById('quest-tab-inner');
  if (!inner) return;
  const settings = await getAppSettings('active_questionnaires');
  const activeTypes = (settings && settings.types) ? settings.types : [];
  if (activeTypes.length === 0) {
    inner.innerHTML = `<p class="muted" style="text-align:center;padding:1rem">${t('quest_active_none')}</p>`;
    return;
  }
  const done = await getMyQuestResponses(state.athlete.id);
  const doneTodaySet = new Set(done.filter(r => r.response_date === today()).map(r => r.questionnaire_type));
  let html = '';
  activeTypes.forEach(qtype => {
    const def = QUESTIONNAIRES[qtype];
    if (!def) return;
    const name = state.lang === 'tr' ? def.name_tr : def.name_en;
    const isDone = doneTodaySet.has(qtype);
    html += `<div class="quest-manage-item" style="margin-bottom:.75rem">
      <div><strong>${name}</strong></div>
      ${isDone
        ? `<span class="toggle-btn" style="background:#28a745;color:#fff;cursor:default">${t('quest_done')}</span>`
        : `<button class="btn-primary" style="font-size:.85rem;padding:.4rem 1rem" onclick="startQuest('${qtype}')">${t('quest_fill')}</button>`
      }
    </div>`;
  });
  inner.innerHTML = html || `<p class="muted" style="text-align:center;padding:1rem">${t('quest_active_none')}</p>`;
}

window.startQuest = function(qtype) {
  state.currentQuest = { type: qtype, page: 0, answers: {} };
  renderQuestForm();
};

function renderQuestForm() {
  const app = document.getElementById('app');
  const q = state.currentQuest;
  const def = QUESTIONNAIRES[q.type];
  const name = state.lang === 'tr' ? def.name_tr : def.name_en;
  const perPage = def.items_per_page || 8;
  const totalPages = Math.ceil(def.items.length / perPage);
  const pageItems = def.items.slice(q.page * perPage, (q.page + 1) * perPage);
  const scale = state.lang === 'tr' ? def.scale_tr : def.scale_en;
  const vals = def.values;
  const isLast = q.page === totalPages - 1;

  let itemsHtml = pageItems.map(item => {
    const text = state.lang === 'tr' ? item.tr : item.en;
    return `<div class="quest-card">
      <div class="quest-item-text">${item.id}. ${text}</div>
      <div class="likert-wrap">
        ${scale.map((label, i) => {
          const val = vals[i];
          const sel = q.answers[item.id] === val;
          return `<label class="likert-opt ${sel ? 'selected' : ''}">
            <input type="radio" name="q${item.id}" value="${val}" onchange="selectAnswer(${item.id}, ${val})" ${sel ? 'checked' : ''} style="display:none">
            <span>${label}</span>
          </label>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
  <div style="max-width:700px;margin:0 auto;padding:1rem">
    ${renderHeader(name)}
    <div style="margin:.75rem 0;font-size:.85rem;color:#666">Sayfa ${q.page+1} / ${totalPages}</div>
    <div id="quest-err" class="alert" style="display:none;background:#fef2f2;border-color:#f87171;color:#b91c1c"></div>
    ${itemsHtml}
    <div style="display:flex;gap:.75rem;margin-top:1rem">
      ${q.page > 0 ? `<button class="btn-secondary" onclick="questPrev()">${t('prev')}</button>` : ''}
      <button class="btn-primary" style="margin-left:auto" onclick="${isLast ? 'submitQuest()' : 'questNext()'}">${isLast ? t('submit_quest') : t('next')}</button>
    </div>
  </div>`;
}

window.selectAnswer = function(itemId, val) {
  state.currentQuest.answers[itemId] = val;
  document.querySelectorAll(`input[name="q${itemId}"]`).forEach(inp => {
    const lbl = inp.closest('.likert-opt');
    if (lbl) lbl.classList.toggle('selected', parseInt(inp.value) === val);
  });
};

window.questNext = function() {
  const q = state.currentQuest;
  const def = QUESTIONNAIRES[q.type];
  const perPage = def.items_per_page || 8;
  const pageItems = def.items.slice(q.page * perPage, (q.page + 1) * perPage);
  const unanswered = pageItems.filter(item => q.answers[item.id] === undefined);
  if (unanswered.length > 0) {
    const err = document.getElementById('quest-err');
    if (err) { err.style.display='block'; err.textContent = state.lang==='tr' ? 'Lütfen tüm soruları yanıtlayın.' : 'Please answer all questions.'; }
    window.scrollTo(0, 0);
    return;
  }
  q.page++;
  renderQuestForm();
  window.scrollTo(0,0);
};

window.questPrev = function() {
  state.currentQuest.page--;
  renderQuestForm();
  window.scrollTo(0,0);
};

window.submitQuest = async function() {
  const q = state.currentQuest;
  const def = QUESTIONNAIRES[q.type];
  const perPage = def.items_per_page || 8;
  const pageItems = def.items.slice(q.page * perPage, (q.page + 1) * perPage);
  const unanswered = pageItems.filter(item => q.answers[item.id] === undefined);
  if (unanswered.length > 0) {
    const err = document.getElementById('quest-err');
    if (err) { err.style.display='block'; err.textContent = state.lang==='tr' ? 'Lütfen tüm soruları yanıtlayın.' : 'Please answer all questions.'; }
    window.scrollTo(0, 0);
    return;
  }
  const total = Object.values(q.answers).reduce((s, v) => s + v, 0);
  console.log('[submitQuest] kaydediliyor — athlete:', state.athlete?.id, 'type:', q.type, 'toplam puan:', total);
  const ok = await saveQuestResponse(state.athlete?.id, q.type, q.answers, total);
  if (ok) {
    state.currentQuest = null;
    await renderSporcu();
    state.sporcuTab = 'quest';
    switchSporcuTab('quest');
    setTimeout(() => {
      const inner = document.getElementById('quest-tab-inner');
      if (inner) {
        const msg = document.createElement('div');
        msg.className = 'alert alert-success';
        msg.style.marginBottom = '1rem';
        msg.textContent = t('quest_submitted');
        inner.prepend(msg);
      }
    }, 200);
  } else {
    const err = document.getElementById('quest-err');
    if (err) {
      err.style.display = 'block';
      err.textContent = state.lang === 'tr'
        ? '⚠ Anket kaydedilemedi. Konsolda hata detayını görün veya sayfayı yenileyip tekrar deneyin.'
        : '⚠ Could not save questionnaire. Check console for error details.';
      window.scrollTo(0, 0);
    }
  }
};

  const sl = document.getElementById('hsl-'+key);
  const val = parseInt(sl.value);
  document.getElementById('hval-'+key).textContent = val;
  const pct = (val-1)/6;
  const desc = document.getElementById('hdesc-'+key);
  if (pct <= 0.3) desc.textContent = t(loKey);
  else if (pct >= 0.7) desc.textContent = t(hiKey);
  else desc.textContent = '';
  // Update total
  let total = 0;
  ['fatigue','stress','muscle_soreness','sleep_quality'].forEach(k => {
    const s = document.getElementById('hsl-'+k);
    if (s) total += parseInt(s.value);
  });
  const totEl = document.getElementById('hoop-total');
  if (totEl) totEl.textContent = `${t('hooper_total')}: ${total}/28`;
};

/* ---- sporcu: RR file upload ---- */
window.processRRFile = function() {
  const fileInput = document.getElementById('rr-file-input');
  const errDiv   = document.getElementById('rr-error');
  const resultDiv = document.getElementById('rr-result');
  const hide = () => { if (resultDiv) resultDiv.style.display='none'; };

  if (errDiv) errDiv.style.display='none';
  if (!fileInput || !fileInput.files || !fileInput.files[0]) {
    if (errDiv) { errDiv.textContent = state.lang==='tr' ? 'Lütfen bir dosya seçin.' : 'Please select a file.'; errDiv.style.display='block'; }
    hide(); return;
  }
  const reader = new FileReader();
  reader.onerror = () => {
    if (errDiv) { errDiv.textContent = t('hrv_parse_error'); errDiv.style.display='block'; }
    hide();
  };
  reader.onload = function(e) {
    const intervals = parseRRIntervals(e.target.result || '');
    if (intervals.length < 60) {
      if (errDiv) { errDiv.textContent = t('hrv_min_intervals') + ' (' + intervals.length + ' ' + t('hrv_intervals_lbl') + ')'; errDiv.style.display='block'; }
      hide(); return;
    }
    const m = computeFullHRV(intervals);
    if (!m) { if (errDiv) { errDiv.textContent = t('hrv_parse_error'); errDiv.style.display='block'; } hide(); return; }
    state.rrMetrics = m;
    const set = (id, v, fmt) => { const el = document.getElementById(id); if (el) el.textContent = v !== null && v !== undefined ? (fmt ? fmt(v) : v) : '—'; };
    set('rr-meanrr-val', m.meanRR);
    set('rr-hr-val',     m.meanHR);
    set('rr-sdnn-val',   m.sdnn,  v => v.toFixed(1));
    set('rr-rmssd-val',  m.rmssd, v => v.toFixed(1));
    set('rr-nn50-val',   m.nn50);
    set('rr-pnn50-val',  m.pnn50);
    set('rr-tinn-val',   m.tiNN);
    set('rr-count-val',  m.count);
    set('rr-tp-val',     m.tp);
    set('rr-lf-val',     m.lf);
    set('rr-hf-val',     m.hf);
    set('rr-lfhf-val',   m.lfHf);
    set('rr-lfnorm-val', m.lfNorm);
    set('rr-hfnorm-val', m.hfNorm);
    set('rr-sd1-val',    m.sd1);
    set('rr-sd2-val',    m.sd2);
    set('rr-sd2sd1-val', m.sd2sd1);
    set('rr-sampen-val', m.sampen);
    // Show frequency-domain note if too few intervals
    const freqGroup = document.getElementById('rr-freq-group');
    if (freqGroup) {
      if (m.tp === null) {

/* ---- researcher: RR file upload ---- */
window.processRRFileAdmin = function() {
  const fileInput = document.getElementById('rr-admin-file-input');
  const errDiv    = document.getElementById('rr-admin-error');
  const resultDiv = document.getElementById('rr-admin-result');
  const hide = () => { if (resultDiv) resultDiv.style.display='none'; };

  if (errDiv) errDiv.style.display='none';
  if (!fileInput || !fileInput.files || !fileInput.files[0]) {
    if (errDiv) { errDiv.textContent = state.lang==='tr' ? 'Lütfen bir dosya seçin.' : 'Please select a file.'; errDiv.style.display='block'; }
    hide(); return;
  }
  const reader = new FileReader();
  reader.onerror = () => {
    if (errDiv) { errDiv.textContent = t('hrv_parse_error'); errDiv.style.display='block'; }
    hide();
  };
  reader.onload = function(e) {
    const intervals = parseRRIntervals(e.target.result || '');
    if (intervals.length < 60) {
      if (errDiv) { errDiv.textContent = t('hrv_min_intervals') + ' (' + intervals.length + ' ' + t('hrv_intervals_lbl') + ')'; errDiv.style.display='block'; }
      hide(); return;
    }
    const m = computeFullHRV(intervals);
    if (!m) { if (errDiv) { errDiv.textContent = t('hrv_parse_error'); errDiv.style.display='block'; } hide(); return; }
    state.rrMetricsAdmin = m;
    const set = (id, v, fmt) => { const el = document.getElementById(id); if (el) el.textContent = v !== null && v !== undefined ? (fmt ? fmt(v) : v) : '—'; };
    set('rr-admin-meanrr-val', m.meanRR);
    set('rr-admin-hr-val',     m.meanHR);
    set('rr-admin-sdnn-val',   m.sdnn,  v => v.toFixed(1));
    set('rr-admin-rmssd-val',  m.rmssd, v => v.toFixed(1));
    set('rr-admin-nn50-val',   m.nn50);
    set('rr-admin-pnn50-val',  m.pnn50);
    set('rr-admin-tinn-val',   m.tiNN);
    set('rr-admin-count-val',  m.count);
    set('rr-admin-tp-val',     m.tp);
    set('rr-admin-lf-val',     m.lf);
    set('rr-admin-hf-val',     m.hf);
    set('rr-admin-lfhf-val',   m.lfHf);
    set('rr-admin-lfnorm-val', m.lfNorm);
    set('rr-admin-hfnorm-val', m.hfNorm);
    set('rr-admin-sd1-val',    m.sd1);
    set('rr-admin-sd2-val',    m.sd2);
    set('rr-admin-sd2sd1-val', m.sd2sd1);
    set('rr-admin-sampen-val', m.sampen);
    // Show frequency-domain note if too few intervals
    const freqGroup = document.getElementById('rr-admin-freq-group');
    if (freqGroup && m.tp === null) {
      freqGroup.innerHTML = `<div class="hrv-metric-group-title">${t('hrv_freq_domain')}</div><div style="font-size:.8rem;color:var(--muted);padding:4px 0">${t('hrv_freq_short')}</div>`;
    }
    document.getElementById('rr-admin-save-success').style.display = 'none';
    const btn = document.getElementById('rr-admin-save-btn');
    if (btn) btn.style.display='block';
    if (resultDiv) resultDiv.style.display='block';
  };
  reader.readAsText(fileInput.files[0]);
};

window.exportData = async function(type) {
  const start = document.getElementById('exp-start')?.value;
  const end = document.getElementById('exp-end')?.value;
  if (type === 'hrv') {
    const rows = await getAllHRV(start, end);
    dlCSV('hrv_data.csv', rows.map(r => ({
      Tarih: r.reading_date,
      Sporcu: r.athletes ? `${r.athletes.name} ${r.athletes.surname}` : '',
      FormNo: r.athletes?.jersey_number || '',
      RMSSD: r.rmssd, LF_HF: r.lf_hf, IstirahatKH: r.resting_hr, Notlar: r.notes
    })), ['Tarih','Sporcu','FormNo','RMSSD','LF_HF','IstirahatKH','Notlar']);
  } else if (type === 'hooper') {
    const rows = await getAllHooper(start, end);
    dlCSV('hooper_data.csv', rows.map(r => ({
      Tarih: r.entry_date,
      Sporcu: r.athletes ? `${r.athletes.name} ${r.athletes.surname}` : '',
      FormNo: r.athletes?.jersey_number || '',
      Yorgunluk: r.fatigue, Stres: r.stress, KasAgrisi: r.muscle_soreness,
      UykuKalitesi: r.sleep_quality, Toplam: r.total_score
    })), ['Tarih','Sporcu','FormNo','Yorgunluk','Stres','KasAgrisi','UykuKalitesi','Toplam']);
  } else if (type === 'rpe') {
    const rows = await getAllRPE(start, end);
    dlCSV('rpe_data.csv', rows.map(r => ({
      Tarih: r.session_date,
      Sporcu: r.athletes ? `${r.athletes.name} ${r.athletes.surname}` : '',
      FormNo: r.athletes?.jersey_number || '',
      Antrenman: r.session_name, Sure_dk: r.duration_minutes,
      RPE_Borg: r.rpe_score, Yuk: r.session_load
    })), ['Tarih','Sporcu','FormNo','Antrenman','Sure_dk','RPE_Borg','Yuk']);
  } else if (type === 'quest') {
    const rows = await getAllQuestResponses(start, end);
    // Build dynamic item columns from QUESTIONNAIRES definitions
    const allItems = {};
    Object.entries(QUESTIONNAIRES).forEach(([qtype, def]) => {
      def.items.forEach(item => { allItems[`${qtype}_${item.id}`] = `${qtype}_M${item.id}`; });
    });
    const baseKeys = ['Tarih','Sporcu','FormNo','AnketTipi','ToplamPuan'];
    const mapped = rows.map(r => {
      const def = QUESTIONNAIRES[r.questionnaire_type];
      const base = {
        Tarih: r.response_date,
        Sporcu: r.athletes ? `${r.athletes.name} ${r.athletes.surname}` : '',
        FormNo: r.athletes?.jersey_number || '',
        AnketTipi: r.questionnaire_type,
        ToplamPuan: r.score ?? '',
      };
      if (def && r.answers) {
        def.items.forEach(item => {
          base[`${r.questionnaire_type}_M${item.id}`] = r.answers[item.id] ?? '';
        });
      }
      return base;
    });
    // Collect all unique column keys that actually appear
    const allKeys = [...baseKeys];
    mapped.forEach(row => { Object.keys(row).forEach(k => { if (!allKeys.includes(k)) allKeys.push(k); }); });
    dlCSV('anket_data.csv', mapped, allKeys);
  }
};

window.toggleQuest = async function(qtype, currentlyActive) {
  const settings = await getAppSettings('active_questionnaires');
  let types = (settings && settings.types) ? [...settings.types] : [];
  if (currentlyActive) {
    types = types.filter(t => t !== qtype);
  } else {
    if (!types.includes(qtype)) types.push(qtype);
  }
  const ok = await setAppSettings('active_questionnaires', { types });
  const msg = document.getElementById('quest-manage-msg');
  if (ok) {
    if (msg) { msg.style.display='block'; msg.style.background='#f0fdf4'; msg.style.color='#166534'; msg.style.borderColor='#86efac'; msg.textContent = state.lang==='tr' ? 'Kaydedildi.' : 'Saved.'; setTimeout(() => { if (msg) msg.style.display='none'; }, 2000); }
    // Refresh data entry tab
    const dataEl = document.getElementById('tab-data');
    if (dataEl && dataEl.classList.contains('active')) await renderDataEntryTab(dataEl);
  } else {
    if (msg) { msg.style.display='block'; msg.style.background='#fef2f2'; msg.style.color='#b91c1c'; msg.style.borderColor='#f87171'; msg.textContent = state.lang==='tr' ? 'Kaydedilemedi.' : 'Could not save.'; }
  }
};

window.doForgotPassword = async function() {
  const email = document.getElementById('f-email')?.value.trim();
  const btn = document.getElementById('f-btn');
  const msg = document.getElementById('forgot-msg');
  if (!email) return;
  if (btn) { btn.disabled = true; btn.textContent = t('loading'); }
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if (msg) {
    msg.style.display = 'block';
    if (error) {
      msg.style.background = '#fef2f2'; msg.style.color = '#b91c1c'; msg.style.borderColor = '#f87171';
      msg.textContent = error.message;
      if (btn) { btn.disabled = false; btn.textContent = t('forgot_send'); }
    } else {
      msg.style.background = '#f0fdf4'; msg.style.color = '#166534'; msg.style.borderColor = '#86efac';
      msg.textContent = t('forgot_sent');
      if (btn) btn.style.display = 'none';
    }
  }
};

window.doSetPassword = async function() {
  const pass = document.getElementById('sp-pass')?.value;
  const pass2 = document.getElementById('sp-pass2')?.value;
  const btn = document.getElementById('sp-btn');
  const msg = document.getElementById('sp-msg');
  if (!pass || pass.length < 8) {
    if (msg) { msg.style.display='block'; msg.style.background='#fef2f2'; msg.style.color='#b91c1c'; msg.style.borderColor='#f87171'; msg.textContent = state.lang==='tr' ? 'Şifre en az 8 karakter olmalı.' : 'Password must be at least 8 characters.'; }
    return;
  }
  if (pass !== pass2) {
    if (msg) { msg.style.display='block'; msg.style.background='#fef2f2'; msg.style.color='#b91c1c'; msg.style.borderColor='#f87171'; msg.textContent = state.lang==='tr' ? 'Şifreler eşleşmiyor.' : 'Passwords do not match.'; }
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = t('loading'); }
  const { error } = await db.auth.updateUser({ password: pass });
  if (error) {
    if (msg) { msg.style.display='block'; msg.style.background='#fef2f2'; msg.style.color='#b91c1c'; msg.style.borderColor='#f87171'; msg.textContent = error.message; }
    if (btn) { btn.disabled = false; btn.textContent = t('set_pass_btn'); }
  } else {
    if (msg) { msg.style.display='block'; msg.style.background='#f0fdf4'; msg.style.color='#166534'; msg.style.borderColor='#86efac'; msg.textContent = state.lang==='tr' ? 'Şifreniz kaydedildi! Yönlendiriliyorsunuz...' : 'Password saved! Redirecting...'; }
    setTimeout(() => route(), 1500);
  }
};

window.setLangLogin = function(lang) {
  state.lang = lang;
  localStorage.setItem('rc_lang', lang);
  document.documentElement.lang = lang;
  renderLogin();
};

window.doLogin = async function() {
  const email = document.getElementById('l-email')?.value.trim();
  const pass  = document.getElementById('l-pass')?.value;
  const btn   = document.getElementById('l-btn');
  const err   = document.getElementById('login-err');
  if (!email || !pass) return;
  if (btn) { btn.disabled = true; btn.textContent = t('loading'); }
  if (err) err.classList.remove('show');

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error || !data.user) {
    if (err) err.classList.add('show');
    if (btn) { btn.disabled = false; btn.textContent = t('login_btn'); }
    return;
  }
  state.user = data.user;
  await loadAthleteProfile();
  route();
};

async function loadAthleteProfile() {
  state.athlete = await getMyAthleteProfile();
}

async function route() {
  const app = document.getElementById('app');
  if (!state.user) { renderLogin(); return; }
  if (!state.athlete) {
    app.innerHTML = renderHeader('—') + `<div class="main"><div class="alert alert-warn">${t('setup_msg')}</div></div>`;
    return;
  }
  const role = state.athlete.role;
  if (role === 'sporcu') await renderSporcu();
  else if (role === 'antrenor') await renderAntrenor();
  else if (role === 'arastirmaci') await renderArastirmaci();
  else {
    app.innerHTML = renderHeader('—') + `<div class="main"><div class="alert alert-warn">${t('setup_msg')}</div></div>`;
  }
}

   INIT
   ============================================================ */
// Register external service worker for PWA installability
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

async function init() {
  document.documentElement.lang = state.lang;

  // Handle Supabase auth redirect tokens in URL hash
  // e.g. #access_token=...&type=invite or type=recovery
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    const params = new URLSearchParams(hash.slice(1));
    const type = params.get('type');
    if (type === 'invite' || type === 'recovery' || type === 'signup') {
      const { data, error } = await db.auth.getSession();
      history.replaceState(null, '', window.location.pathname);
      if (!error && data.session) {
        state.user = data.session.user;
        renderSetPassword();
        db.auth.onAuthStateChange(async (event, session) => {
          if (event === 'SIGNED_OUT') { state.user = null; state.athlete = null; renderLogin(); }
          if (event === 'USER_UPDATED') { await loadAthleteProfile(); route(); }
        });
        return;
      }
    }
  }

  const { data: { session } } = await db.auth.getSession();
  if (session) {
    state.user = session.user;
    await loadAthleteProfile();
  }
  await route();

  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_OUT') {
      state.user = null;
      state.athlete = null;
      renderLogin();
    }
    if (event === 'PASSWORD_RECOVERY') {
      renderSetPassword();
    }
    if (event === 'USER_UPDATED' && session) {
      state.user = session.user;
      await loadAthleteProfile();
      route();
    }
  });
}

init();

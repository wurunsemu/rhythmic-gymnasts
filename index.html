<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A3C5E;
  --red:#C8102E;
  --green:#22c55e;
  --yellow:#f59e0b;
  --danger:#ef4444;
  --bg:#f0f4f8;
  --card:#ffffff;
  --text:#1e293b;
  --muted:#64748b;
  --border:#e2e8f0;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-size:16px;
  line-height:1.5;
}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ============================================================
   LOADING
   ============================================================ */
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   LOGIN
   ============================================================ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(135deg,var(--navy) 0%,#2a5a8e 100%)}
.login-card{background:var(--card);border-radius:20px;padding:40px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-size:1.4rem;color:var(--navy);font-weight:800;line-height:1.2}
.login-logo p{color:var(--muted);font-size:.85rem;margin-top:4px}
.login-stripe{width:48px;height:4px;background:var(--red);border-radius:2px;margin:12px auto 0}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;outline:none;transition:border-color .2s;background:#fafafa}
.form-group input:focus{border-color:var(--navy);background:#fff}
.btn-primary{width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.88}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{padding:8px 16px;background:transparent;color:var(--navy);border:1.5px solid var(--navy);border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-secondary:hover{background:var(--navy);color:#fff}
.btn-sm{padding:7px 14px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{opacity:.85}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{opacity:.85}
.login-err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:10px 14px;font-size:.85rem;margin-bottom:14px;display:none}
.login-err.show{display:block}
.lang-switch-login{text-align:center;margin-top:20px}
.lang-btn{background:transparent;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.8);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;margin:0 4px;transition:all .2s}
.lang-btn.active{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.8);color:#fff}

/* ============================================================
   HEADER
   ============================================================ */
.header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-brand{font-weight:800;font-size:1rem;line-height:1.1;flex:1}
.header-brand small{font-weight:400;font-size:.75rem;opacity:.75;display:block}
.header-actions{display:flex;align-items:center;gap:8px}
.lang-toggle{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600}
.lang-toggle:hover{background:rgba(255,255,255,.2)}
.logout-btn{background:rgba(200,16,46,.25);border:1px solid rgba(200,16,46,.5);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;font-weight:600}
.logout-btn:hover{background:var(--red)}

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
.main{flex:1;padding:16px;max-width:960px;margin:0 auto;width:100%}
.main-wide{flex:1;padding:16px;width:100%}

/* ============================================================
   CARDS
   ============================================================ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:1.1rem}

/* ============================================================
   TABS
   ============================================================ */
.tab-bar{display:flex;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.tab-btn{flex:1;padding:12px 8px;border:none;background:transparent;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy);background:rgba(26,60,94,.04)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ============================================================
   FORMS
   ============================================================ */
.form-row{margin-bottom:18px}
.form-label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.form-sublabel{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.form-select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;background:#fafafa;outline:none;cursor:pointer}
.form-select:focus{border-color:var(--navy)}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;background:#fafafa;outline:none}
.form-input:focus{border-color:var(--navy);background:#fff}
.form-textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:.9rem;background:#fafafa;outline:none;resize:vertical;min-height:80px}
.form-textarea:focus{border-color:var(--navy);background:#fff}

/* Slider */
.slider-wrap{margin-bottom:14px}
.slider-label{font-size:.9rem;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.slider-label span{color:var(--navy);font-size:1rem;font-weight:800}
.slider-desc{font-size:.75rem;color:var(--muted);margin-bottom:6px;min-height:18px}
input[type=range]{width:100%;accent-color:var(--navy);cursor:pointer;height:6px}
.slider-ticks{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted);margin-top:2px;padding:0 2px}

/* Borg selector */
.borg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.borg-btn{padding:10px 4px;border:2px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;text-align:center;transition:all .15s}
.borg-btn .borg-num{font-size:1.1rem;font-weight:800;color:var(--navy)}
.borg-btn .borg-desc{font-size:.6rem;color:var(--muted);line-height:1.1;margin-top:2px}
.borg-btn.selected{border-color:var(--navy);background:var(--navy)}
.borg-btn.selected .borg-num,.borg-btn.selected .borg-desc{color:#fff}

/* ============================================================
   TRAFFIC LIGHT
   ============================================================ */
.tl-table{width:100%;border-collapse:collapse;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tl-table th{background:var(--navy);color:#fff;padding:12px 14px;font-size:.8rem;font-weight:600;text-align:left}
.tl-table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle}
.tl-table tr:last-child td{border-bottom:none}
.tl-table tr:nth-child(even) td{background:#f8fafc}
.tl-dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}
.tl-dot.green{background:var(--green)}
.tl-dot.yellow{background:var(--yellow)}
.tl-dot.red{background:var(--danger)}
.tl-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:700}
.tl-badge.green{background:#dcfce7;color:#15803d}
.tl-badge.yellow{background:#fef9c3;color:#a16207}
.tl-badge.red{background:#fee2e2;color:#b91c1c}

/* ============================================================
   STATUS OVERVIEW CARD
   ============================================================ */
.status-overview{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.status-box{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center}
.status-box .label{font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.status-box .value{font-size:1.6rem;font-weight:800;color:var(--navy)}
.status-box .sub{font-size:.75rem;color:var(--muted);margin-top:2px}

/* ============================================================
   ALERT
   ============================================================ */
.alert{border-radius:10px;padding:12px 16px;font-size:.85rem;margin-bottom:14px}
.alert-info{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
.alert-warn{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}
.alert-err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.alert-ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}

/* ============================================================
   RESEARCHER DASHBOARD
   ============================================================ */
.dashboard-tabs{display:flex;gap:4px;background:var(--navy);padding:4px;border-radius:10px;margin-bottom:16px;overflow-x:auto}
.dtab-btn{padding:9px 18px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.65);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
.dtab-btn.active{background:rgba(255,255,255,.2);color:#fff}
.dtab-btn:hover:not(.active){background:rgba(255,255,255,.1);color:#fff}

/* Charts */
.chart-wrap{position:relative;height:220px;margin-top:12px}

/* Table wrapper for overflow */
.table-scroll{overflow-x:auto}

/* Athlete detail rows */
.athlete-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.athlete-row:hover{background:#f8fafc;border-radius:8px;padding-left:8px}
.athlete-num{width:36px;height:36px;background:var(--navy);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0}
.athlete-info{flex:1}
.athlete-info .name{font-weight:700;font-size:.9rem}
.athlete-info .role-tag{font-size:.72rem;color:var(--muted)}

/* ============================================================
   EXPORT BUTTON
   ============================================================ */
.export-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:12px;transition:opacity .2s}
.export-btn:hover{opacity:.85}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:2.5rem;margin-bottom:8px}
.empty p{font-size:.85rem}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:600px){
  .main,.main-wide{padding:12px}
  .status-overview{grid-template-columns:repeat(2,1fr)}
  .tl-table th,.tl-table td{padding:9px 10px;font-size:.78rem}
  .dashboard-tabs{flex-wrap:nowrap}
}
@media(min-width:768px){
  .main{padding:24px}
  .borg-grid{grid-template-columns:repeat(5,1fr)}
}

/* ============================================================
   MISC
   ============================================================ */
.section-heading{font-size:1.1rem;font-weight:800;color:var(--navy);margin-bottom:14px}
.muted{color:var(--muted);font-size:.8rem}
.mb8{margin-bottom:8px}
.mb16{margin-bottom:16px}
.flex-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.success-banner{background:var(--green);color:#fff;border-radius:10px;padding:14px 16px;text-align:center;font-weight:700;margin-bottom:16px;display:none}
.success-banner.show{display:block}
.today-badge{display:inline-block;background:#e0f2fe;color:#0369a1;border-radius:6px;padding:3px 8px;font-size:.72rem;font-weight:700;margin-left:8px}
.already-done{background:#dcfce7;border:1px solid #bbf7d0;border-radius:10px;padding:14px 16px;color:#15803d;font-size:.85rem;text-align:center;font-weight:600;margin-bottom:14px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
</style>
</head>

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function dlCSV(filename, rows, headers) {
  const csv = [headers.join(','), ...rows.map(r => headers.map(h => JSON.stringify(r[h] ?? '')).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function showSuccess(id) {

}

/* ============================================================
   TRAFFIC LIGHT LOGIC
   ============================================================ */
function acwrStatus(rpeRows) {
  // rpeRows sorted ascending by date, each with session_load
  if (rpeRows.length < 7) return null;
  const now = new Date();
  const msPerDay = 86400000;
  const acute = rpeRows.filter(r => {
    const d = new Date(r.session_date);
    return (now - d) / msPerDay <= 7;
  }).reduce((s, r) => s + (r.session_load || 0), 0);

  const chronic28 = rpeRows.filter(r => {
    const d = new Date(r.session_date);
    return (now - d) / msPerDay <= 28;
  }).reduce((s, r) => s + (r.session_load || 0), 0) / 4;

  if (chronic28 === 0) return null;
  const acwr = acute / chronic28;
  if (acwr >= 0.8 && acwr <= 1.3) return 'green';
  if (acwr >= 0.6 && acwr <= 1.5) return 'yellow';
  return 'red';
}

function hrvStatus(hrvRows) {
  if (hrvRows.length < 3) return null;
  const sorted = [...hrvRows].sort((a,b) => a.reading_date > b.reading_date ? 1 : -1);
  const recent = sorted.slice(-7);
  const baseline = recent.slice(0,-1).reduce((s,r) => s + r.rmssd, 0) / (recent.length - 1);
  const latest = recent[recent.length - 1].rmssd;
  const diff = (baseline - latest) / baseline;
  if (diff < 0.1) return 'green';
  if (diff < 0.2) return 'yellow';
  return 'red';
}

function hooperStatus(total) {
  if (total == null) return null;
  if (total <= 16) return 'green';
  if (total <= 22) return 'yellow';
  return 'red';
}

function overallStatus(a, b, c) {
  const vals = [a,b,c].filter(x => x !== null);
  if (vals.length === 0) return null;
  if (vals.includes('red')) return 'red';
  if (vals.includes('yellow')) return 'yellow';
  return 'green';
}

function tlBadge(status) {
  if (!status) return '<span class="muted">—</span>';
  const labels = {green: t('green'), yellow: t('yellow'), red: t('red')};
  return `<span class="tl-badge ${status}">${labels[status]}</span>`;
}

/* ============================================================
   CHARTS
   ============================================================ */
function chartDefaults() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {legend:{display:false}, tooltip:{mode:'index',intersect:false}},
    scales: {
      x: {grid:{color:'rgba(0,0,0,0.04)'}, ticks:{font:{size:10}, maxTicksLimit:8}},
      y: {grid:{color:'rgba(0,0,0,0.04)'}, ticks:{font:{size:10}}}
    }
  };
}
function drawLineChart(id, labels, data, label, color, fill, yMin, yMax) {
  const el = document.getElementById(id);
  if (!el) return;
  const existing = Chart.getChart(el);
  if (existing) existing.destroy();
  const opts = chartDefaults();
  if (yMin !== undefined) opts.scales.y.min = yMin;
  if (yMax !== undefined) opts.scales.y.max = yMax;
  new Chart(el, {
    type:'line',
    data:{labels, datasets:[{label, data, borderColor:color, backgroundColor:fill, fill:true, tension:0.3, pointRadius:3}]},
    options:opts
  });
}
function drawBarChart(id, labels, data, label) {
  const el = document.getElementById(id);
  if (!el) return;
  const existing = Chart.getChart(el);
  if (existing) existing.destroy();
  new Chart(el, {
    type:'bar',
    data:{labels, datasets:[{label, data, backgroundColor:'rgba(26,60,94,0.65)', borderRadius:4}]},
    options:chartDefaults()
  });
}

window.switchSporcuTab = function(tab) {
  state.sporcuTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  const btn = [...document.querySelectorAll('.tab-btn')].find(b => b.textContent.trim() === t('tab_'+tab));
  if (btn) btn.classList.add('active');
  const c = document.getElementById('tab-'+tab);
  if (c) c.classList.add('active');

  // Draw HRV chart when switching to HRV tab
  if (tab === 'hrv') {
    setTimeout(async () => {
      const hrv = await getHRVHistory(state.athlete.id, 30);
      drawLineChart('hrv-chart-sporcu', hrv.map(r=>r.reading_date), hrv.map(r=>r.rmssd), 'RMSSD', 'rgba(26,60,94,1)', 'rgba(26,60,94,0.1)');
    }, 50);

};

window.updateSlider = function(key, loKey, hiKey) {
  const sl = document.getElementById('hsl-'+key);
  const val = parseInt(sl.value);
  document.getElementById('hval-'+key).textContent = val;
  const pct = (val-1)/6;
  const desc = document.getElementById('hdesc-'+key);
  if (pct <= 0.3) desc.textContent = t(loKey);
  else if (pct >= 0.7) desc.textContent = t(hiKey);
  else desc.textContent = '';
  // Update total
  let total = 0;
  ['fatigue','stress','muscle_soreness','sleep_quality'].forEach(k => {
    const s = document.getElementById('hsl-'+k);
    if (s) total += parseInt(s.value);
  });
  const totEl = document.getElementById('hoop-total');
  if (totEl) totEl.textContent = `${t('hooper_total')}: ${total}/28`;
};

window.submitHooper = async function() {
  const scores = {};
  ['fatigue','stress','muscle_soreness','sleep_quality'].forEach(k => {
    const el = document.getElementById('hsl-'+k);
    scores[k] = el ? parseInt(el.value) : 4;
  });
  const ok = await saveHooper(state.athlete.id, scores);
  if (ok) {
    showSuccess('hoop-success');
    setTimeout(() => renderSporcu(), 1500);
  }
};

let selectedBorg = null;
window.selectBorg = function(val) {
  selectedBorg = val;
  document.getElementById('borg-container').innerHTML = borgGrid(val);
  updateLoadPreview();
};
function updateLoadPreview() {
  const dur = parseInt(document.getElementById('rpe-duration')?.value) || 0;
  if (dur && selectedBorg) {
    const load = dur * selectedBorg;
    const prev = document.getElementById('load-preview');
    if (prev) {
      prev.style.display = 'block';
      prev.textContent = `${t('session_load')}: ${load} AU`;
    }
  }
}

window.submitRPE = async function() {
  const name = document.getElementById('rpe-session-name')?.value;
  const dur = parseInt(document.getElementById('rpe-duration')?.value);
  if (!dur || !selectedBorg) {
    alert(state.lang === 'tr' ? 'Lütfen tüm alanları doldurun.' : 'Please fill all fields.');
    return;
  }
  const ok = await saveRPE(state.athlete.id, {
    session_name: name || null,
    duration_minutes: dur,
    rpe_score: selectedBorg
  });
  if (ok) {
    showSuccess('rpe-success');
    selectedBorg = null;
    document.getElementById('rpe-duration').value = '';
    document.getElementById('rpe-session-name').value = '';
    document.getElementById('borg-container').innerHTML = borgGrid(null);
    document.getElementById('load-preview').style.display = 'none';
  }
};

  const jersey = parseInt(document.getElementById('new-jersey')?.value) || null;
  const role = document.getElementById('new-role')?.value || 'sporcu';
  if (!name || !surname || !email) {
    const err = document.getElementById('add-athlete-err');
    if (err) { err.style.display='block'; err.textContent = state.lang === 'tr' ? 'Ad, soyad ve e-posta zorunludur.' : 'Name, surname and email are required.'; }
    return;
  }
  const { data, error } = await insertAthlete({name, surname, email, jersey_number:jersey, role});
  if (error) {
    const err = document.getElementById('add-athlete-err');
    if (err) { err.style.display='block'; err.textContent = error.message; }
    return;
  }
  state.athletes = await getAllAthletes();
  await switchResearchTab('athletes_tab');
};

  const rhr = parseInt(document.getElementById('hrv-rhr')?.value) || null;

  const notes = document.getElementById('hrv-notes')?.value || null;

  if (errEl) errEl.style.display='none';
  const ok = await saveHRV({athlete_id:athleteId, reading_date:date, rmssd, resting_hr:rhr, lf_hf:lfhf, notes});

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="login-wrap">
    <div>
      <div class="login-card">
        <div class="login-logo">
          <h1>${t('app_title')}</h1>
          <p>${t('app_sub')}</p>

          <label>${t('email')}</label>
          <input type="email" id="l-email" autocomplete="email" placeholder="sporcu@example.com">
        </div>
        <div class="form-group">
          <label>${t('password')}</label>
          <input type="password" id="l-pass" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn-primary" id="l-btn" onclick="doLogin()">${t('login_btn')}</button>
      </div>
      <div class="lang-switch-login">
        <button class="lang-btn ${state.lang==='tr'?'active':''}" onclick="setLangLogin('tr')">Türkçe</button>
        <button class="lang-btn ${state.lang==='en'?'active':''}" onclick="setLangLogin('en')">English</button>
      </div>
    </div>
  </div>`;

  document.getElementById('l-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.doLogin();
  });
}

window.setLangLogin = function(lang) {
  state.lang = lang;
  localStorage.setItem('rc_lang', lang);
  document.documentElement.lang = lang;
  renderLogin();
};

window.doLogin = async function() {
  const email = document.getElementById('l-email')?.value.trim();
  const pass  = document.getElementById('l-pass')?.value;
  const btn   = document.getElementById('l-btn');
  const err   = document.getElementById('login-err');
  if (!email || !pass) return;
  if (btn) { btn.disabled = true; btn.textContent = t('loading'); }
  if (err) err.classList.remove('show');

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error || !data.user) {
    if (err) err.classList.add('show');
    if (btn) { btn.disabled = false; btn.textContent = t('login_btn'); }
    return;
  }
  state.user = data.user;
  await loadAthleteProfile();
  route();
};

async function loadAthleteProfile() {
  state.athlete = await getMyAthleteProfile();
}

async function route() {
  const app = document.getElementById('app');
  if (!state.user) { renderLogin(); return; }
  if (!state.athlete) {
    app.innerHTML = renderHeader('—') + `<div class="main"><div class="alert alert-warn">${t('setup_msg')}</div></div>`;
    return;
  }
  const role = state.athlete.role;
  if (role === 'sporcu') await renderSporcu();
  else if (role === 'antrenor') await renderAntrenor();
  else if (role === 'arastirmaci') await renderArastirmaci();
  else {
    app.innerHTML = renderHeader('—') + `<div class="main"><div class="alert alert-warn">${t('setup_msg')}</div></div>`;
  }
}

// ============================================================
// SERVICE WORKER — register for PWA installability
// ============================================================
if ('serviceWorker' in navigator) {
  // Inline service worker via blob so no separate sw.js file is needed
  const swCode = `
const CACHE = 'rc-v1';
const SHELL = ['/', '/index.html'];
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL).catch(() => {})));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  // Network-first for Supabase API calls; cache-first for shell
  if (e.request.url.includes('supabase.co')) return;
  e.respondWith(
    fetch(e.request).catch(() => caches.match(e.request).then(r => r || fetch(e.request)))
  );
});`;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

async function init() {
  document.documentElement.lang = state.lang;
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    state.user = session.user;
    await loadAthleteProfile();
  }
  await route();

  // Listen for auth changes
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_OUT') {
      state.user = null;
      state.athlete = null;
      renderLogin();
    }
  });
}

init();
